[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name           winevtlog
    Channels       Application,System,Security
    Interval_Sec   1
    String_Inserts Off
    DB             C:\ProgramData\fluent-bit-winevtlog.sqlite

[OUTPUT]
    Name               opensearch
    Match              *
    Host               127.0.0.1
    Port               9200
    HTTP_User          admin
    HTTP_Passwd        CHANGE_ME
    tls                On
    tls.verify         Off
    Suppress_Type_Name On
    Logstash_Format    On
    Logstash_Prefix    winlogs
    Replace_Dots       On
    Buffer_Size        5MB
